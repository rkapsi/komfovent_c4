name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub release for it. HACS lists
# releases, not bare tags, so this is what makes a version installable.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json;print(json.load(open("custom_components/komfovent_c4/manifest.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
